<script>
// Navigation authentication state management
function updateNavAuth() {
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const navAuthButtons = document.getElementById('navAuthButtons');
    
    if (token && user.user_id) {
        navAuthButtons.innerHTML = `
            <a href="dashboard.html" class="bg-gradient-to-r from-blue-500 to-purple-600 text-white px-4 py-2 rounded-lg hover:from-blue-600 hover:to-purple-700 transition-all duration-200 font-medium">
                داشبورد
            </a>
            <button onclick="logout()" class="text-gray-700 hover:text-red-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                خروج
            </button>
        `;
    } else {
        navAuthButtons.innerHTML = `
            <a href="login.html" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">ورود</a>
            <a href="register.html" class="bg-gradient-to-r from-blue-500 to-purple-600 text-white px-4 py-2 rounded-lg hover:from-blue-600 hover:to-purple-700 transition-all duration-200 font-medium">ثبت‌نام</a>
        `;
    }
}

function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'login.html';
}

// Initialize navigation on page load
document.addEventListener('DOMContentLoaded', updateNavAuth);
</script>
